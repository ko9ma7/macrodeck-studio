name: Collect market data and deploy MacroDeck

on:
  push:
    branches: ["main"]
  schedule:
    # 30분 스냅샷. 매시 정각/30분 혼잡을 피하도록 13분/43분 사용.
    - cron: "13,43 * * * *"
      timezone: "Asia/Seoul"
    # 일별 시계열 병합: 미국 장 마감 후 + 한국 장 데이터가 모두 확정된 시간대.
    - cron: "17 7 * * *"
      timezone: "Asia/Seoul"
    # 누락 구간 복구용 전체 과거자료 백필. 주 1회만 실행.
    - cron: "29 4 * * 0"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      mode:
        description: "데이터 수집 모드"
        required: true
        default: "snapshot"
        type: choice
        options:
          - snapshot
          - daily
          - backfill
          - all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macrodeck-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Decide collection mode
        id: mode
        shell: bash
        run: |
          MODE="none"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ github.event.schedule }}" in
              "17 7 * * *") MODE="daily" ;;
              "29 4 * * 0") MODE="backfill" ;;
              *) MODE="snapshot" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Collection mode: $MODE"

      - name: Collect and persist market data
        if: steps.mode.outputs.mode != 'none'
        run: >-
          python scripts/update_market_data.py
          --data-dir public/data
          --mode "${{ steps.mode.outputs.mode }}"
          --snapshot-minutes 30

      - name: Validate data
        run: npm run check

      - name: Commit refreshed static data
        if: steps.mode.outputs.mode != 'none'
        shell: bash
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes"
          else
            git config user.name "macrodeck-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: ${{ steps.mode.outputs.mode }} collection [skip ci]"
            git push
          fi

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
