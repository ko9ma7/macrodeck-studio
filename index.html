<!doctype html>
<html lang="ko" data-theme="system" data-density="compact">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MacroDeck — 매크로 시장 모니터</title>
  <meta name="description" content="금리·물가·환율·주가지수·원자재의 누적 시계열을 반응형 카드와 상세 차트로 확인하고, 개인 배열을 브라우저에 저장하는 매크로 대시보드." />
  <meta name="theme-color" content="#f7f9fc" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MacroDeck — 매크로 시장 모니터" />
  <meta property="og:description" content="누적 시계열 + 자동 데이터 갱신 + 개인 카드 배열" />
  <meta property="og:image" content="./og-image.png" />
  <meta property="og:site_name" content="MacroDeck" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="MacroDeck — 매크로 시장 모니터" />
  <meta name="twitter:description" content="누적 시계열 + 자동 데이터 갱신 + 개인 카드 배열" />
  <meta name="twitter:image" content="./og-image.png" />
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css" />
  <link id="uiStyleSheet" rel="stylesheet" href="./src/themes/monitor.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="MacroDeck 홈">
        <span class="brand-mark">MD</span>
        <span class="brand-copy"><strong>MacroDeck</strong><span>Macro Market Monitor</span></span>
      </a>
      <div class="header-status" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="statusText">데이터 확인 중…</span>
      </div>
      <div class="header-controls">
        <label class="header-select-wrap">
          <span>UI</span>
          <select id="uiStyle" class="ui-style-select" aria-label="UI 스타일"></select>
        </label>
        <label class="header-select-wrap">
          <span>색상</span>
          <select id="theme" class="theme-select" aria-label="색상 모드">
            <option value="system">시스템</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="container dashboard-shell">
    <section class="dashboard-heading">
      <div>
        <h1>매크로 모니터</h1>
        <p>금리·물가·환율·시장·원자재의 현재값과 누적 시계열을 한 화면에서 봅니다.</p>
      </div>
      <div class="heading-meta">
        <span id="historyMeta">누적 데이터 계산 중…</span>
        <span class="separator">·</span>
        <span>카드 클릭 → 누적 차트 · 24H/7D/30D/90D/1Y/전체</span>
      </div>
    </section>

    <section class="control-strip" aria-label="대시보드 보기 설정">
      <label class="search-box">
        <span class="sr-only">검색</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.15A7.5 7.5 0 1 1 4 11.5a7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" type="search" placeholder="지표 검색" />
      </label>
      <select id="groupFilter" class="control-select" aria-label="그룹"></select>
      <select id="sort" class="control-select" aria-label="정렬">
        <option value="custom">내 순서</option>
        <option value="priority">중요도 순</option>
        <option value="change">변동폭 순</option>
        <option value="group">그룹 순</option>
        <option value="name">이름 순</option>
      </select>
      <select id="columns" class="control-select" aria-label="열 수">
        <option value="auto">자동 배열</option>
        <option value="4">4열</option>
        <option value="5">5열</option>
        <option value="6">6열</option>
        <option value="7">7열</option>
      </select>
      <label class="toggle-label"><input id="favoritesOnly" type="checkbox" /> <span>★만</span></label>
      <button class="quiet-btn" id="viewMenu" type="button" aria-expanded="false">보기 설정</button>
      <div class="view-popover" id="viewPopover" hidden>
        <label>밀도<select id="density"><option value="compact">촘촘하게</option><option value="comfortable">여유롭게</option></select></label>
        <button class="menu-btn" id="resetLayout" type="button">배열 초기화</button>
        <button class="menu-btn" id="exportPrefs" type="button">설정 내보내기</button>
        <label class="menu-btn file-label" for="importPrefs">설정 가져오기</label>
        <input id="importPrefs" type="file" accept="application/json" hidden />
      </div>
    </section>

    <section id="error" class="error-box" hidden>
      시장 데이터 파일을 읽지 못했습니다. <code>public/data/</code>와 GitHub Pages 배포 상태를 확인해주세요.
    </section>

    <section id="cards" class="cards" aria-live="polite"></section>
    <section id="empty" class="empty" hidden>조건에 맞는 지표가 없습니다.</section>
  </main>

  <dialog id="detailDialog" class="detail-dialog" aria-labelledby="detailTitle">
    <div class="detail-shell">
      <div class="detail-header">
        <div>
          <span id="detailGroup" class="detail-group"></span>
          <h2 id="detailTitle">상세 차트</h2>
        </div>
        <button class="close-btn" id="detailClose" aria-label="닫기">×</button>
      </div>
      <div class="detail-value-line">
        <strong id="detailValue">-</strong>
        <span id="detailChange"></span>
        <span id="detailAsOf"></span>
      </div>
      <div class="range-tabs" id="rangeTabs" role="tablist" aria-label="차트 기간">
        <button data-range="24h" role="tab">24시간</button>
        <button data-range="7" role="tab">7일</button>
        <button data-range="30" role="tab">30일</button>
        <button data-range="90" role="tab" class="active">90일</button>
        <button data-range="365" role="tab">1년</button>
        <button data-range="max" role="tab">전체</button>
      </div>
      <div id="detailChart" class="detail-chart" aria-live="polite"></div>
      <div id="detailStats" class="detail-stats"></div>
      <div id="detailNote" class="detail-note"></div>
    </div>
  </dialog>

  <footer class="container footer">
    <span>공개 시장 데이터 기반 정보 확인용 도구 · 투자 조언 아님</span>
    <span id="dataHealth">자동 갱신 상태 확인 중…</span>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
